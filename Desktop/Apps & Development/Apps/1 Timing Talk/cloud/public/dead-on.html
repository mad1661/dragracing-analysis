<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead On — Timing Talk</title>
<link rel="stylesheet" href="/styles.css">
<style>
.do-controls{display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap;}
.do-meta{font-size:0.72rem;color:rgba(255,255,255,0.4);margin-left:auto;}
.cat-group{margin-bottom:1.5rem;}
.cat-header{display:flex;align-items:center;gap:0.6rem;padding:0.65rem 1rem;background:linear-gradient(90deg,rgba(200,16,46,0.12),transparent);border-left:3px solid #c8102e;border-radius:0 8px 8px 0;margin-bottom:0.5rem;}
.cat-header h3{font-size:0.9rem;font-weight:800;color:#e2e8f0;}
.cat-badge{background:rgba(234,179,8,0.18);color:#eab308;font-size:0.65rem;font-weight:800;padding:0.15rem 0.5rem;border-radius:99px;}
.do-wrap{background:linear-gradient(180deg,rgba(13,21,43,0.92),rgba(8,13,28,0.98));border:1px solid rgba(255,255,255,0.1);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.do-wrap::before{content:'';display:block;height:2px;background:linear-gradient(90deg,#ff304f,#ffd166,#3357ff);}
.do-scroll{max-height:60vh;overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent;}
.do-table{width:100%;border-collapse:collapse;font-size:0.75rem;}
.do-table th{position:sticky;top:0;z-index:2;padding:0.5rem 0.6rem;font-size:0.55rem;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.4);background:linear-gradient(180deg,rgba(12,19,40,0.98),rgba(10,16,34,0.95));border-bottom:1px solid rgba(255,255,255,0.1);text-align:center;}
.do-table td{padding:0.45rem 0.6rem;border-bottom:1px solid rgba(255,255,255,0.04);font-weight:600;text-align:center;font-family:'SF Mono','Fira Code','Consolas',monospace;}
.do-table tr:hover{background:rgba(255,255,255,0.03);}
.do-win{background:rgba(34,197,94,0.08);}
.do-win:hover{background:rgba(34,197,94,0.14) !important;}
.do-loss{background:rgba(255,255,255,0.02);}
.td-name{font-family:'Oswald','Impact',sans-serif !important;text-align:left !important;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-deadon{color:#22c55e;font-weight:900;font-size:0.9rem;}
.wl-win{display:inline-block;background:linear-gradient(180deg,#22c55e,#4ade80);color:#052e16;font-size:0.55rem;font-weight:900;padding:0.12rem 0.4rem;border-radius:4px;}
.wl-loss{display:inline-block;background:rgba(239,68,68,0.2);color:#ef4444;font-size:0.55rem;font-weight:900;padding:0.12rem 0.4rem;border-radius:4px;}
.no-results{text-align:center;padding:3rem;color:rgba(255,255,255,0.3);font-size:1rem;}
</style>
</head>
<body data-nav-utility="dead-on">
<div class="tt-shell-content" id="main-content">
  <div class="page-header">
    <h1>Dead On</h1>
    <p class="page-subtitle">Runs where ET exactly matched the dial-in</p>
  </div>

  <div class="do-controls">
    <span id="context-label" style="font-size:0.85rem;color:rgba(255,255,255,0.6);font-weight:600;"></span>
    <span class="do-meta" id="do-count"></span>
  </div>

  <div id="do-container"><div class="no-results">Loading...</div></div>
</div>

<script src="/auth.js"></script>
<script src="/shell.js"></script>
<script>
const deviceId = localStorage.getItem("tt-selected-device") || "";
const eventId = localStorage.getItem("tt-selected-event") || "";

function init() {
  const label = document.getElementById("context-label");
  if (!deviceId) {
    label.innerHTML = 'No device selected. <a href="/event-set.html" style="color:#ffd166;">Go to Event Set</a>';
    document.getElementById("do-container").innerHTML = '';
    return;
  }
  if (!eventId) {
    label.innerHTML = 'No event selected. <a href="/event-set.html" style="color:#ffd166;">Go to Event Set</a>';
    document.getElementById("do-container").innerHTML = '';
    return;
  }
  label.textContent = "Loading...";
  loadData();
}

async function loadData() {
  try {
    let res;
    if (eventId === "__all__") {
      res = await fetch("/api/runs?device_id=" + encodeURIComponent(deviceId) + "&limit=2000");
    } else {
      res = await fetch("/api/events/" + encodeURIComponent(eventId) + "/results");
    }
    const data = await res.json();
    const races = data.races || data || [];
    document.getElementById("context-label").textContent = races.length + " runs loaded";
    findDeadOns(races);
  } catch(e) {
    console.error("Failed to load:", e);
    document.getElementById("do-container").innerHTML = '<div class="no-results">Failed to load results</div>';
  }
}

function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function findDeadOns(races) {
  const TOLERANCE = 0.0005;
  const results = {};
  let totalCount = 0;

  races.forEach(r => {
    const cat = r.category || "Unknown";

    ["left", "right"].forEach(side => {
      const p = side + "_";
      const name = r[p + "name"];
      const et = parseFloat(r[p + "et"]);
      const dial = parseFloat(r[p + "dial"]);

      if (!name || isNaN(et) || isNaN(dial) || dial <= 0) return;
      if (Math.abs(et - dial) > TOLERANCE) return;

      const isWinner = r.winner && r.winner.toUpperCase() === side.toUpperCase();

      if (!results[cat]) results[cat] = [];
      results[cat].push({
        name: name.trim(),
        carNum: r[p + "car_num"] || "",
        et: r[p + "et"],
        dial: r[p + "dial"],
        rt: r[p + "rt"] || "",
        round: r.round || "",
        isWin: isWinner
      });
      totalCount++;
    });
  });

  document.getElementById("do-count").textContent = totalCount + " dead-on run" + (totalCount !== 1 ? "s" : "");
  renderResults(results);
}

function renderResults(results) {
  const el = document.getElementById("do-container");
  const cats = Object.keys(results).sort();

  if (!cats.length) {
    el.innerHTML = '<div class="no-results">No dead-on runs found</div>';
    return;
  }

  let html = "";
  cats.forEach(cat => {
    const items = results[cat];
    html += '<div class="cat-group">';
    html += '<div class="cat-header"><h3>' + esc(cat) + '</h3><span class="cat-badge">' + items.length + '</span></div>';
    html += '<div class="do-wrap"><div class="do-scroll"><table class="do-table">';
    html += '<thead><tr><th style="text-align:left">Racer</th><th>Car #</th><th>ET = Dial</th><th>RT</th><th>Round</th><th>W/L</th></tr></thead><tbody>';
    items.forEach(item => {
      const rowClass = item.isWin ? 'do-win' : 'do-loss';
      const badge = item.isWin ? '<span class="wl-win">WIN</span>' : '<span class="wl-loss">LOSS</span>';
      html += '<tr class="' + rowClass + '">';
      html += '<td class="td-name">' + esc(item.name) + '</td>';
      html += '<td>' + esc(item.carNum) + '</td>';
      html += '<td class="td-deadon">' + esc(item.et) + ' = ' + esc(item.dial) + '</td>';
      html += '<td>' + esc(item.rt) + '</td>';
      html += '<td>' + esc(item.round) + '</td>';
      html += '<td>' + badge + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div></div>';
  });

  el.innerHTML = html;
}

init();
</script>
</body>
</html>
